name: Replace TxPick references

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace legacy TxPick references in website HTML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = [
              ('https://txpick.com', 'https://sodepmy.com'),
              ('http://txpick.com', 'https://sodepmy.com'),
              ('TxPick.com', 'sodepmy.com'),
              ('txpick.com', 'sodepmy.com'),
              ('Founder TxPick', 'Founder Số Đẹp Mỹ'),
              ('Founder của TxPick', 'Founder của Số Đẹp Mỹ'),
              ('Founder of TxPick', 'Founder of Số Đẹp Mỹ'),
              ('Founder TxPick', 'Founder Số Đẹp Mỹ'),
              ('TxPick', 'Số Đẹp Mỹ'),
          ]

          changed = []
          for p in Path('.').rglob('*.html'):
              text = p.read_text(encoding='utf-8')
              new = text
              for old, repl in replacements:
                  new = new.replace(old, repl)
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  changed.append(str(p))
          print('Changed files:')
          print('\n'.join(changed) if changed else '(none)')
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No legacy TxPick references left in HTML."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html' 2>/dev/null || git add -A
          git commit -m "Replace legacy TxPick references with So Dep My"
          git push
